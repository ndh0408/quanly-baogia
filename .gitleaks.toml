# Cấu hình gitleaks — mở rộng bộ luật mặc định, KHÔNG thay thế.
# Gitleaks tự đọc file này khi nằm ở gốc nguồn quét.
#
# Nguyên tắc: allowlist phải HẸP. Không bao giờ bỏ qua cả thư mục `tests/` — test vẫn là nơi bí mật
# thật hay bị dán vào (chuỗi kết nối, token staging). Chỉ miễn trừ ĐÚNG chuỗi đã kiểm chứng bằng mắt,
# và ghim thêm đường dẫn để cùng chuỗi đó ở chỗ khác vẫn bị bắt.

[extend]
useDefault = true

[[allowlists]]
description = """
Khoá mã hoá GIẢ trong test đơn vị MFA (tests/mfa.test.js:7).

Đây không phải bí mật: chuỗi tự mô tả nó là đồ giả, độ dài cố ý đủ 16 ký tự chỉ để vượt qua ràng buộc
`MFA_ENC_KEY: z.string().min(16)` của config, nhằm chạy được nhánh AES-256-GCM thay vì nhánh dự phòng
plaintext. Nó chưa từng mở khoá dữ liệu thật ở bất kỳ môi trường nào.

Gitleaks gắn cờ vì entropy 3.82 khớp luật `generic-api-key`. Không miễn trừ thì bước Security của CI
(`--exit-code 1`) đỏ vĩnh viễn, và một cảnh báo luôn-đỏ là cảnh báo bị bỏ qua — nguy hiểm hơn không có.
"""
paths = ['''^tests/mfa\.test\.js$''']
regexes = ['''test-mfa-encryption-key-at-least-16''']

# Mật khẩu demo dùng chung, viết thẳng trong mã.
#
# Chuỗi cũ nằm ở BA nơi (prisma/seed-demo.js, scripts/dev/rc-qa.mjs, tài liệu handoff) và là mật
# khẩu MẶC ĐỊNH cho mọi tài khoản demo được seed, gồm cả `admin` — trong một repo publish CÔNG KHAI
# có kèm luôn hostname dev. Ruleset mặc định của gitleaks KHÔNG bắt được vì entropy của một cụm từ
# tiếng Việt viết liền quá thấp. Luật này bắt theo KHUÔN đặt mật khẩu mặc định, không bắt theo đúng
# một chuỗi cụ thể — chuỗi thì đổi, thói quen thì không.
[[rules]]
id = "hardcoded-default-password"
description = "Mật khẩu mặc định viết thẳng trong mã (PWD/PASS/PASSWORD = \"...\" hoặc || \"...\")"
regex = '''(?i)(?:PWD|PASS|PASSWORD|SECRET)\s*=\s*(?:process\.env\.\w+\s*\|\|\s*)?["'][A-Za-z0-9@#$%^&*_-]{10,}["']'''
[rules.allowlist]
# Miễn theo GIÁ TRỊ, không chỉ theo đường dẫn: một chuỗi tự nói rõ nó là đồ vứt đi
# ("test", "smoke", "ci-only", "drill-only", "CHANGE_ME"…) thì không phải bí mật thật, dù nằm ở đâu.
# Miễn theo đường dẫn thôi thì thêm một file dev mới là luật lại kêu oan.
regexes = [
  '''(?i)(test|smoke|ci-only|drill-only|example|placeholder|CHANGE_ME|dummy|fake)''',
]
paths = [
  '''tests/.*''',
  '''\.env\.example''',
  '''\.gitleaks\.toml''',
]
