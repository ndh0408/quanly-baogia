# Compose PROD (gianguyen.cloud, VM coolify, sau Cloudflare tunnel qua network `edge` external).
# BÍ MẬT đọc từ .env (gitignored) qua ${VAR} — KHÔNG hardcode. .env phải có: POSTGRES_PASSWORD,
# REDIS_PASSWORD + toàn bộ env app (SESSION_SECRET, JWT_SECRET, MFA_ENC_KEY, APP_BASE_URL, S3/SMTP…).
# deploy.sh ship file NÀY (đã tracked). ⚠️ TRƯỚC khi deploy prod lần đầu sau modernization: đảm bảo
# prod .env có POSTGRES_PASSWORD + REDIS_PASSWORD (kẻo ${VAR} rỗng → app/redis vỡ).

# XOAY VÒNG LOG cho MỌI service. Driver mặc định của Docker là json-file KHÔNG giới hạn: app dùng
# pino-http ghi mỗi request một dòng, VM production chỉ có MỘT đĩa, và khi đĩa đầy thì Postgres
# không ghi nổi WAL nữa — mất dữ liệu vì log chứ không phải vì lỗi mã. 10MB × 5 tệp = trần 50MB
# mỗi container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    # ẢNH GHIM THEO DIGEST. `postgres:16-alpine` là tag DI ĐỘNG: dựng lại VM sau sự cố có thể kéo về
    # một minor khác với minor đã sinh bản dump — mà `pg_restore`/`psql` KHÔNG nhận dump của server
    # mới hơn. Digest dưới đây là index đa kiến trúc (có linux/amd64), đọc từ registry ngày
    # 2026-08-26. GHIM cũng có nghĩa là KHÔNG tự nhận bản vá bảo mật nữa: làm mới CÓ CHỦ Ý bằng
    #   docker buildx imagetools inspect postgres:16-alpine   (dòng Digest)
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: quanly-postgres
    # Siết đặc quyền cho KHO DỮ LIỆU, không chỉ app/worker. Bản k8s song sinh siết từ lâu
    # (infra/k8s/postgres.yaml:42-46 `allowPrivilegeEscalation: false` + `drop: ["ALL"]`), còn
    # compose — thứ ĐANG CHẠY THẬT — thì chạy full capability.
    # GIỮ LẠI đúng tập capability mà entrypoint chính thức cần. Cơ chế ĐỌC TỪ CHÍNH ẢNH đã ghim
    # digest ở trên (lấy lại bằng `docker cp <container>:/usr/local/bin/docker-entrypoint.sh -`):
    #   dòng 58  `find "$PGDATA" \! -user postgres -exec chown postgres '{}' +` → CHOWN, cộng
    #            DAC_OVERRIDE để root đọc lại được thư mục NGAY SAU khi chính nó chmod 00700, và ở
    #            mọi lượt khởi động trên volume đã có dữ liệu
    #   dòng 343 `exec gosu postgres "$BASH_SOURCE" "$@"`                   → SETUID + SETGID
    #   FOWNER   → ĐO ĐƯỢC LÀ KHÔNG BẮT BUỘC. Bản chú thích trước quy nó cho dòng 41
    #            `chmod 00700 "$PGDATA"`, nhưng dòng đó kết thúc bằng `|| :` nên lỗi bị NUỐT; và
    #            `docker_create_db_directories` được gọi ở dòng 340 TRƯỚC nhánh `id -u = 0`, tức
    #            nó chạy LẠI sau `exec gosu` dưới uid 70 — lúc đó postgres là CHỦ thư mục nên
    #            chmod thành công mà không cần capability nào. Vẫn GIỮ vì hai lý do: nhánh
    #            POSTGRES_INITDB_WALDIR (`chmod 700 "$POSTGRES_INITDB_WALDIR"`) KHÔNG có `|| :` nên sẽ chết thật nếu ai đó
    #            đặt biến ấy, và bỏ FOWNER làm mỗi lượt khởi động in ra `chmod: …: Operation not
    #            permitted` — một dòng báo động giả rất tốn thời gian lúc đang xử lý sự cố.
    # KHÔNG phải su-exec như chú thích cũ ghi: ảnh alpine cài gosu 1.19 thật (ELF 1.7MB), còn
    # `/usr/local/bin/su-exec` chỉ là symlink trỏ về gosu và entrypoint không gọi tên đó.
    # Bỏ toàn bộ phần còn lại (NET_RAW, MKNOD, SYS_CHROOT, AUDIT_WRITE, KILL…).
    # ĐÃ DIỄN TẬP thật 2026-08-27 (docker 29.3.1 / compose v5.1.1, đúng digest trên, máy sandbox
    # — KHÔNG phải VM staging/prod): `docker compose -f docker-compose.staging.yml up -d postgres
    # redis` → cả hai `healthy`, log tới `database system is ready to accept connections`, PID 1
    # chạy dưới user postgres, `CapEff: 0000000000000000`. Khối postgres/redis của prod và staging
    # giống hệt nhau từng dòng nên lượt diễn tập đó phủ cả hai file. Đối chứng đã đo:
    #   • `--cap-drop ALL` không cap_add → chết ngay: `error: failed switching to 'postgres':
    #     operation not permitted`
    #   • bỏ DAC_OVERRIDE mà giữ FOWNER → chết: `find: /var/lib/postgresql/data: Permission
    #     denied` (chmod 0700 chạy xong thì chính root hết đọc nổi thư mục)
    #   • trên volume ĐÃ CÓ dữ liệu, chỉ SETGID+SETUID → cũng `Permission denied` như trên
    #   • bỏ SETUID hoặc bỏ SETGID → `error: failed switching to 'postgres': operation not
    #     permitted` (gosu cần CẢ HAI, có một cái không đủ)
    #   • bỏ CHOWN trên volume mà MỌI tệp đã thuộc postgres → vẫn XANH, vì nhánh `find \! -user
    #     postgres` không khớp gì. Nhưng chown 1 tệp trong PGDATA về root (đúng hình dạng của một
    #     lượt khôi phục từ tar/backup) rồi bỏ CHOWN → ĐỎ ngay: `chown: …/PG_VERSION: Operation
    #     not permitted`. Nói cách khác CHOWN là capability của ĐƯỜNG KHÔI PHỤC, không phải của
    #     đường khởi động thường ngày — đừng siết nó chỉ vì lượt diễn tập thường ngày vẫn xanh.
    #   • bỏ FOWNER (cả volume trống lẫn volume đã có dữ liệu) → XANH; xem giải thích ở trên.
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging
    # Postgres: shared_buffers mặc định 128MB; 2g là trần rộng rãi, chỉ để chặn rò rỉ.
    # TRẦN CPU. Trần RAM chặn container ăn hết bộ nhớ; không có trần CPU thì một vòng lặp thoát ly
    # trong app/worker (xuất báo giá lớn, nhập Excel) vẫn chiếm sạch CPU của VM, và Postgres —
    # thứ phải ghi WAL đúng lúc đó — chỉ còn phần thừa.
    # ⚠️ CÁC CON SỐ NÀY CHƯA ĐO TRÊN VM THẬT, và số vCPU của VM cũng không được ghi ở đâu trong
    # repo. Đây là TRẦN, không phải phần dành riêng: trên VM 2 vCPU thì `cpus: 2` gần như không
    # ràng buộc gì. Vì `deploy.sh` ghi đè file này mỗi lượt deploy (git archive), giá trị được đưa
    # ra `.env` (không tracked, được giữ nguyên trên máy chủ) để chỉnh mà không mất khi deploy:
    #     POSTGRES_CPUS=1.5   REDIS_CPUS=0.5   APP_CPUS=2   WORKER_CPUS=1.5
    # ⚠️ NẾU VM CHỈ CÓ 1 vCPU: docker TỪ CHỐI TẠO container khi trần lớn hơn số CPU sẵn có. Đo
    # được trên sandbox 4 vCPU (2026-08-27): cả `docker run --cpus 9999` lẫn
    # `deploy.resources.limits.cpus: "9999"` qua `docker compose up -d` đều trả
    # `Error response from daemon: range of CPUs is from 0.01 to 4.00, as there are only 4 CPUs
    # available` — trên VM 1 vCPU thì `4.00` thành `1.00`. Mặc định trên giả định VM ≥ 2 vCPU;
    # gặp lỗi thì đặt lại bốn biến trên trong `.env` của máy chủ.
    # MỘT LƯỢT `deploy.sh staging` CÓ chạm postgres/redis — nhưng ở BƯỚC [4/6], không phải [5/6]:
    # [5/6] chỉ `up -d app worker`, còn [4/6] `docker compose run --rm app npx prisma migrate
    # deploy` khởi động các service trong depends_on, và compose recreate service phụ thuộc khi
    # config hash của nó lệch (cap_add và deploy.resources đều nằm trong hash đó). Đo bằng compose
    # v5.1.1: đổi cap_add của dep → `compose run` recreate nó (container id đổi); không đổi gì →
    # không recreate; dep không lên nổi → `compose run` thoát mã 1, `set -e` dừng deploy và app cũ
    # vẫn chạy. CHƯA đối chiếu phiên bản compose trên VM thật, nên đừng coi đó là bảo đảm: cách
    # chắc chắn là diễn tập tay hai service này trước — docs/operations/DEPLOYMENT.md, mục
    # "Diễn tập thay đổi postgres/redis".
    # Việc phải làm: `docker stats` một tuần, xem đỉnh CPU thật lúc xuất báo giá lớn nhất, rồi
    # thay bằng số đo được — y như hai con số RAM (xem docs/REMAINING_RISKS.md).
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "${POSTGRES_CPUS:-1.5}"
    restart: unless-stopped
    environment:
      POSTGRES_USER: quanly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: quanly
    volumes:
      - quanly-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quanly -d quanly"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]
  redis:
    # Ghim digest — xem lý do ở service postgres. Làm mới:
    #   docker buildx imagetools inspect redis:7-alpine
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: quanly-redis
    # Siết như postgres nhưng CƠ CHẾ KHÁC HẲN: ảnh redis:7-alpine KHÔNG có gosu, KHÔNG có su-exec.
    # docker-entrypoint.sh của ảnh (24 dòng) hạ quyền bằng setpriv của util-linux 2.40.4:
    #   dòng 12  `find . \! -user redis -exec chown redis '{}' +`   (`.` là WORKDIR /data)
    #   dòng 13  `exec /usr/bin/setpriv --reuid redis --regid redis --clear-groups "$0" "$@"`
    # Vì sao từng capability (đo 2026-08-27, cùng lượt diễn tập với postgres — xem khối trên):
    #   SETUID, SETGID  → BẮT BUỘC cho setpriv. Chỉ cap_add SETUID thì chết ngay:
    #                     `setpriv: setresgid failed: Operation not permitted`.
    #   CHOWN,          → dành cho nhánh `find … chown` ở dòng 12, chỉ chạy khi /data có tệp KHÔNG
    #   DAC_OVERRIDE      thuộc redis (dump.rdb do root ghi, bind-mount của máy chủ…). Trong diễn
    #                     tập, volume vốn đã thuộc redis nên nhánh này rỗng → CHƯA ĐO ĐƯỢC là cần.
    #   FOWNER          → entrypoint redis không chmod gì cả → CHƯA ĐO ĐƯỢC là cần; đang giữ cho
    #                     trùng tập với postgres. Muốn siết tiếp thì FOWNER là ứng viên đầu tiên.
    # Kết quả diễn tập: `healthy`, log `Ready to accept connections`, PID 1 dưới user redis,
    # `CapEff: 0000000000000000`.
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging
    # Lớn hơn `--maxmemory 256mb` để Redis tự evict/báo lỗi TRƯỚC khi bị OOM-kill.
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: "${REDIS_CPUS:-0.5}" # Redis đơn luồng cho lệnh; 0.5 vẫn dư cho tải của repo này
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD}",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "noeviction",
        "--save",
        "60",
        "1",
      ]
    volumes:
      - quanly-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: quanly-app:prod
    container_name: quanly-app
    # Siết đặc quyền: container này chỉ nghe cổng 3000 (>1024) dưới user `app` nên KHÔNG cần
    # bất kỳ Linux capability nào. Bỏ sạch + cấm leo thang biến một RCE giả định từ "toàn quyền
    # trong container" thành "một tiến trình không đặc quyền". Đường k8s/Helm đã siết như vậy
    # từ lâu (infra/k8s/app.yaml) — compose mới là thứ đang chạy thật thì lại chưa.
    # KHÔNG bật `read_only: true` ở đây: deploy.sh chạy `compose run --rm app npx prisma migrate
    # deploy`, mà npx cần ghi ~/.npm — phải diễn tập bằng docker trước khi bật.
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging
    # exceljs/pdfkit dựng workbook trong bộ nhớ; vượt trần thì CHỈ app chết và tự restart.
    # ⚠️ TRẦN NÀY LÀ SỐ PHỎNG ĐOÁN, CHƯA ĐO TRÊN VM THẬT. Đọc kỹ trước khi tin nó.
    #
    # Đặt cgroup limit mà KHÔNG bảo V8 biết là tự bắn vào chân: Node KHÔNG đọc cgroup limit để
    # chỉnh heap, nó nới heap theo RAM của HOST rồi bị kernel SIGKILL nguyên container. Lúc đó
    # không phải một request hỏng — mà là MỌI request đang bay của MỌI người đứt, SSE đứt, lần
    # Lưu báo giá đang gửi dở mất trắng; `restart: unless-stopped` dựng lại rồi người dùng bấm
    # lại là chết lại. Trước khi có trần, cùng đầu vào đó chỉ làm VM chậm.
    #
    # Nên `--max-old-space-size` đặt ở ~70% trần: V8 GC gắt trước, rồi ném heap-OOM BẮT ĐƯỢC —
    # errorHandler ghi log và trả 500 cho đúng một request, container sống tiếp.
    #
    # Repo BIẾT còn đường tiêu bộ nhớ chưa chặn (nhập Excel nạp cả workbook trên event loop).
    # Việc phải làm: chạy `docker stats` một tuần, xem đỉnh RSS thật khi xuất báo giá lớn nhất,
    # rồi thay hai con số này bằng số đo được. Xem docs/REMAINING_RISKS.md.
    deploy:
      resources:
        limits:
          memory: 1536m
          cpus: "${APP_CPUS:-2}"
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=1024" # ~70% trần 1536m — xem chú thích ở deploy.resources
      PORT: "3000"
      DATABASE_URL: postgresql://quanly:${POSTGRES_PASSWORD}@postgres:5432/quanly?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # ĐẶT TƯỜNG MINH, không phó mặc cho .env trên máy chủ.
      #
      # Topology: Cloudflare → cloudflared → container. Đúng MỘT chặng proxy tin được, nên giá trị
      # là "1". Không đặt thì Express lấy req.ip là IP của cloudflared trong mạng docker — GIỐNG NHAU
      # cho mọi người dùng. Hậu quả: toàn bộ giới hạn theo IP (đăng nhập, API, xuất file) gộp chung
      # MỘT xô — một người gõ nhiều là khoá cả công ty — và nhật ký kiểm toán ghi IP proxy thay vì
      # IP thật, làm điều tra sự cố bảo mật thành vô nghĩa.
      #
      # Đặt "1" chứ KHÔNG đặt "true": "true" tin mọi chặng, nghĩa là client tự thêm X-Forwarded-For
      # là giả được IP nguồn và lách rate-limit.
      TRUST_PROXY: "1"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [internal, edge]
  worker:
    image: quanly-app:prod
    container_name: quanly-worker
    # Siết đặc quyền: worker chỉ chạy node dưới user `app`, không mở cổng, không cần Linux
    # capability nào. Bỏ sạch + cấm leo thang để một RCE giả định không leo được lên root
    # trong container. Đường k8s/Helm siết như vậy từ lâu (infra/k8s/worker.yaml); compose
    # mới là thứ đang chạy thật thì lại chưa.
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging
    # Worker chạy đúng những job xuất file nặng nhất — cùng trần với app.
    deploy:
      resources:
        limits:
          memory: 2g # worker dựng workbook exceljs/pdfkit — cao hơn app
          # Worker là việc NỀN: một job xuất chậm đi vài giây không ai thấy, còn app/Postgres bị
          # đói CPU thì mọi người thấy ngay. Nên worker là chỗ đặt trần chặt nhất.
          cpus: "${WORKER_CPUS:-1.5}"
    restart: unless-stopped
    # Cùng artifact đã biên dịch với app (Dockerfile build ra dist/). Không còn tsx lúc chạy.
    command: ["node", "dist/worker.js"]
    # ÂN HẠN DỪNG. Không khai khoá này thì `docker compose down/up` cho worker đúng 10s mặc định
    # của Docker rồi SIGKILL — NHỎ HƠN cả trần cứng 30s của riêng bước sinh file trong một job xuất
    # (`EXPORT_GEN_TIMEOUT_MS` ở src/exportQueue.ts, có hiệu lực qua `sinhFileXuat` trong
    # src/worker.ts → `runExportJob(..., { choPhepNoiTuyen: false })`). worker.ts bắt SIGTERM rồi `await Worker.close()`, tức
    # chờ job đang chạy xong; bị cắt ngang thì BullMQ giữ khoá tới hết lockDuration (5 phút,
    # src/queue.ts) mới cho chạy lại — người dùng thấy bản xuất đứng im suốt lượt deploy. Đây là
    # đường ĐANG CHẠY THẬT (deploy.sh), nên nó quan trọng hơn hai đường k8s/Helm cùng sửa kèm.
    # 90 khớp infra/k8s/worker.yaml và values.yaml. CHƯA đo trên VM thật — là mức chọn có căn cứ.
    stop_grace_period: 90s
    # Worker nền (không HTTP) → tắt healthcheck HTTP kế thừa Dockerfile (luôn fail = unhealthy giả).
    healthcheck:
      disable: true
    env_file: .env
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=1400" # worker DỰNG workbook → trần cao hơn app
      DATABASE_URL: postgresql://quanly:${POSTGRES_PASSWORD}@postgres:5432/quanly?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [internal]
volumes:
  quanly-pgdata:
  quanly-redisdata:
networks:
  internal:
  edge:
    external: true
