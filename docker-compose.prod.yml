# Compose PROD (gianguyen.cloud, VM coolify, sau Cloudflare tunnel qua network `edge` external).
# BÍ MẬT đọc từ .env (gitignored) qua ${VAR} — KHÔNG hardcode. .env phải có: POSTGRES_PASSWORD,
# REDIS_PASSWORD + toàn bộ env app (SESSION_SECRET, JWT_SECRET, MFA_ENC_KEY, APP_BASE_URL, S3/SMTP…).
# deploy.sh ship file NÀY (đã tracked). ⚠️ TRƯỚC khi deploy prod lần đầu sau modernization: đảm bảo
# prod .env có POSTGRES_PASSWORD + REDIS_PASSWORD (kẻo ${VAR} rỗng → app/redis vỡ).

# XOAY VÒNG LOG cho MỌI service. Driver mặc định của Docker là json-file KHÔNG giới hạn: app dùng
# pino-http ghi mỗi request một dòng, VM production chỉ có MỘT đĩa, và khi đĩa đầy thì Postgres
# không ghi nổi WAL nữa — mất dữ liệu vì log chứ không phải vì lỗi mã. 10MB × 5 tệp = trần 50MB
# mỗi container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    container_name: quanly-postgres
    logging: *default-logging
    # Postgres: shared_buffers mặc định 128MB; 2g là trần rộng rãi, chỉ để chặn rò rỉ.
    deploy:
      resources:
        limits:
          memory: 2g
    restart: unless-stopped
    environment:
      POSTGRES_USER: quanly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: quanly
    volumes:
      - quanly-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quanly -d quanly"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]
  redis:
    image: redis:7-alpine
    container_name: quanly-redis
    logging: *default-logging
    # Lớn hơn `--maxmemory 256mb` để Redis tự evict/báo lỗi TRƯỚC khi bị OOM-kill.
    deploy:
      resources:
        limits:
          memory: 384m
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD}",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "noeviction",
        "--save",
        "60",
        "1",
      ]
    volumes:
      - quanly-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: quanly-app:prod
    container_name: quanly-app
    # Siết đặc quyền: container này chỉ nghe cổng 3000 (>1024) dưới user `app` nên KHÔNG cần
    # bất kỳ Linux capability nào. Bỏ sạch + cấm leo thang biến một RCE giả định từ "toàn quyền
    # trong container" thành "một tiến trình không đặc quyền". Đường k8s/Helm đã siết như vậy
    # từ lâu (infra/k8s/app.yaml) — compose mới là thứ đang chạy thật thì lại chưa.
    # KHÔNG bật `read_only: true` ở đây: deploy.sh chạy `compose run --rm app npx prisma migrate
    # deploy`, mà npx cần ghi ~/.npm — phải diễn tập bằng docker trước khi bật.
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging
    # exceljs/pdfkit dựng workbook trong bộ nhớ; vượt trần thì CHỈ app chết và tự restart.
    deploy:
      resources:
        limits:
          memory: 1536m
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://quanly:${POSTGRES_PASSWORD}@postgres:5432/quanly?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # ĐẶT TƯỜNG MINH, không phó mặc cho .env trên máy chủ.
      #
      # Topology: Cloudflare → cloudflared → container. Đúng MỘT chặng proxy tin được, nên giá trị
      # là "1". Không đặt thì Express lấy req.ip là IP của cloudflared trong mạng docker — GIỐNG NHAU
      # cho mọi người dùng. Hậu quả: toàn bộ giới hạn theo IP (đăng nhập, API, xuất file) gộp chung
      # MỘT xô — một người gõ nhiều là khoá cả công ty — và nhật ký kiểm toán ghi IP proxy thay vì
      # IP thật, làm điều tra sự cố bảo mật thành vô nghĩa.
      #
      # Đặt "1" chứ KHÔNG đặt "true": "true" tin mọi chặng, nghĩa là client tự thêm X-Forwarded-For
      # là giả được IP nguồn và lách rate-limit.
      TRUST_PROXY: "1"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [internal, edge]
  worker:
    image: quanly-app:prod
    container_name: quanly-worker
    # Siết đặc quyền: worker chỉ chạy node dưới user `app`, không mở cổng, không cần Linux
    # capability nào. Bỏ sạch + cấm leo thang để một RCE giả định không leo được lên root
    # trong container. Đường k8s/Helm siết như vậy từ lâu (infra/k8s/worker.yaml); compose
    # mới là thứ đang chạy thật thì lại chưa.
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging
    # Worker chạy đúng những job xuất file nặng nhất — cùng trần với app.
    deploy:
      resources:
        limits:
          memory: 1536m
    restart: unless-stopped
    # Cùng artifact đã biên dịch với app (Dockerfile build ra dist/). Không còn tsx lúc chạy.
    command: ["node", "dist/worker.js"]
    # Worker nền (không HTTP) → tắt healthcheck HTTP kế thừa Dockerfile (luôn fail = unhealthy giả).
    healthcheck:
      disable: true
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://quanly:${POSTGRES_PASSWORD}@postgres:5432/quanly?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [internal]
volumes:
  quanly-pgdata:
  quanly-redisdata:
networks:
  internal:
  edge:
    external: true
