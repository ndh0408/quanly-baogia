# Miễn trừ Trivy — CÓ PHẠM VI, không tắt luật toàn cục.
#
# Dùng .trivyignore.yaml (không dùng .trivyignore dạng danh sách ID) để mỗi miễn trừ ghim vào ĐÚNG
# đường dẫn. Tắt cả luật thì lần sau có bí mật thật lọt vào ConfigMap khác sẽ không ai biết.

misconfigurations:
  - id: KSV-0109
    paths:
      - "infra/k8s/configmap.yaml"
    statement: >
      False positive đã kiểm bằng mắt. KSV-0109 khớp theo TÊN KHOÁ nghi là bí mật; ở đây nó bắt đúng
      một khoá là PASSWORD_MIN_LENGTH="8" — chỉ vì tên có chữ PASSWORD. Đó là CHÍNH SÁCH độ dài mật
      khẩu tối thiểu (một con số), không phải mật khẩu.

      Bí mật thật (JWT_SECRET, SESSION_SECRET, DATABASE_PASSWORD, REDIS_PASSWORD, MFA_ENC_KEY,
      S3_ACCESS_KEY, S3_SECRET_KEY) nằm ở Secret riêng — xem infra/k8s/secret.example.yaml — và luôn
      được nạp qua secretRef, không bao giờ qua ConfigMap. Toàn bộ 19 khoá trong configmap.yaml là
      tham số điều chỉnh công khai: cỡ trang, số lần đăng nhập sai, thời hạn token, mức log.

      Nếu sau này thêm khoá mới vào configmap.yaml, PHẢI xem lại miễn trừ này — nó ghim theo đường dẫn
      nên sẽ che luôn mọi phát hiện KSV-0109 khác trong chính file đó.
