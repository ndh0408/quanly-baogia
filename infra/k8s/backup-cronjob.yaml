# Daily PostgreSQL backup CronJob (k8s path). Dumps via pg_dump using the same
# DATABASE_URL the app uses, to a PVC, and prunes dumps older than 14 days.
# For managed databases prefer the provider's automated snapshots/PITR; this is a
# portable fallback so there is ALWAYS a backup.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: quanly-db-backups
  namespace: quanly
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: quanly-db-backup
  namespace: quanly
spec:
  schedule: "0 2 * * *" # 02:00 daily
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 70 # postgres user in the alpine image
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-dump
              image: postgres:16-alpine
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: quanly-secrets
                      key: DATABASE_URL
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  # Bản dump chứa CCCD / số tài khoản / lương thô → không để ai-cũng-đọc.
                  umask 077
                  STAMP=$(date +%Y%m%d_%H%M%S)
                  OUT="/backups/quanly_${STAMP}.dump"
                  echo "Backing up to ${OUT}"
                  # Ghi ra .partial rồi mới đổi tên. Ghi THẲNG vào tên cuối là cái bẫy mà
                  # scripts/backup/backup-db.sh đã phải viết hẳn một đoạn để tránh: pod bị evict
                  # giữa chừng để lại một .dump CỤT nhưng trông hợp lệ, rồi bước prune bên dưới
                  # xoá mất bản TỐT cũ hơn. Đổi tên trên cùng filesystem là thao tác nguyên tử.
                  pg_dump "$DATABASE_URL" -Fc -f "$OUT.partial"
                  # pg_restore -l đọc mục lục của kho lưu trữ: bắt được file cụt mà kiểm cỡ bỏ lọt.
                  pg_restore -l "$OUT.partial" > /dev/null
                  mv "$OUT.partial" "$OUT"
                  # Checksum cạnh file: sau này đối chiếu được bản đã sao đi nơi khác có bằng bản gốc.
                  sha256sum "$OUT" | awk '{print $1}' > "$OUT.sha256"
                  # Prune CHỈ chạy sau khi bản mới đã hoàn chỉnh — không bao giờ xoá bản cũ dựa trên
                  # một lượt backup còn chưa chắc thành công.
                  echo "Pruning backups older than 14 days"
                  find /backups -name '*.dump' -mtime +14 -delete
                  find /backups -name '*.dump.sha256' -mtime +14 -delete
                  # Dọn file tạm mồ côi của những lượt chết giữa chừng trước đây.
                  find /backups -name '*.dump.partial' -mmin +180 -delete
                  echo "BACKUP_DONE"
              volumeMounts:
                - { name: backups, mountPath: /backups }
                # readOnlyRootFilesystem=true ở trên: pg_dump/pg_restore vẫn cần /tmp ghi được.
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: quanly-db-backups
            - { name: tmp, emptyDir: {} }
