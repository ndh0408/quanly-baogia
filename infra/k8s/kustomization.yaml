apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: quanly
resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - redis.yaml
  - networkpolicy.yaml
  - app.yaml
  - worker.yaml
  - ingress.yaml
  - backup-cronjob.yaml

# ẢNH BẤT BIẾN. Các manifest ghi tag placeholder `:REPLACE_ME`; kustomize thay bằng digest/sha thật
# lúc deploy, ví dụ:
#   kustomize edit set image ghcr.io/ndh0408/quanly-baogia=ghcr.io/ndh0408/quanly-baogia@sha256:...
# Cố tình KHÔNG để `latest`: hai pod cùng ReplicaSet có thể kéo hai bản mã khác nhau, và rollback
# thì không còn gì để quay về.
images:
  - name: ghcr.io/ndh0408/quanly-baogia
    newTag: REPLACE_ME
