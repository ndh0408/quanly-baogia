# Copy to secret.yaml and fill in real values. DO NOT COMMIT secret.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: quanly-secrets
  namespace: quanly
type: Opaque
stringData:
  # DATABASE_PASSWORD được postgres StatefulSet tham chiếu (không optional) — PHẢI khớp mật khẩu trong DATABASE_URL.
  DATABASE_PASSWORD: "CHANGE_ME"
  DATABASE_URL: "postgresql://quanly:CHANGE_ME@postgres:5432/quanly?schema=public"
  # REDIS_PASSWORD được redis Deployment dùng cho --requirepass — PHẢI khớp mật khẩu trong REDIS_URL.
  REDIS_PASSWORD: "CHANGE_ME_REDIS"
  REDIS_URL: "redis://:CHANGE_ME_REDIS@redis:6379"
  SESSION_SECRET: "CHANGE_ME_PRODUCTION_USE_LONG_RANDOM_STRING_OF_AT_LEAST_32_CHARS"
  JWT_SECRET: "" # leave empty to derive from SESSION_SECRET
  # BẮT BUỘC ở production. src/config.ts gọi process.exit(1) khi NODE_ENV=production mà thiếu key
  # này → deploy theo đúng file mẫu sẽ chết vòng lặp ngay lần khởi động đầu, và không có gì trong
  # manifest gợi ý vì sao.
  MFA_ENC_KEY: "CHANGE_ME_AT_LEAST_16_CHARS"
  # ⚠️ MẤT KHOÁ NÀY = MẤT DỮ LIỆU, không có đường khôi phục.
  # Ba trường PII (CCCD / số tài khoản / lương) được mã hoá bằng nó. Thiếu khoá thì bản ghi MỚI
  # được ghi THÔ (chỉ console.warn, không ai nhận ra) còn bản ghi CŨ ném lỗi lúc giải mã.
  # Sao lưu khoá ở nơi KHÁC với bản dump CSDL: để chung thì mất một chỗ là mất cả hai.
  PII_ENC_KEY: ""
  # /metrics trả 404 ở production khi thiếu token (src/app.ts). Để trống = tắt hẳn endpoint.
  METRICS_TOKEN: ""
  S3_ENDPOINT: "https://s3.example.com"
  S3_ACCESS_KEY: "CHANGE_ME"
  S3_SECRET_KEY: "CHANGE_ME"
  SMTP_HOST: "smtp.example.com"
  SMTP_PORT: "587"
  SMTP_USER: ""
  SMTP_PASS: ""
  SMTP_FROM: "Báo Giá <noreply@example.com>"
  TELEGRAM_BOT_TOKEN: ""
