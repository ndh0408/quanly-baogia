# NON-PRODUCTION single-instance Postgres for dev/staging clusters.
# In production use a managed DB (RDS / Cloud SQL / Supabase / Neon).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: quanly-pgdata
  namespace: quanly
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: quanly
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      # UID/GID 70 là user `postgres` trong ảnh postgres:16-alpine. fsGroup để PVC được cấp quyền
      # nhóm đúng ngay lần gắn đầu tiên (chưa từng deploy nên không có PVC cũ để va quyền).
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          # Hệ thống tệp gốc CHỈ ĐỌC. Postgres cần ghi ở ĐÚNG ba chỗ, đều gắn volume riêng bên dưới:
          # dữ liệu (PVC), socket đơn vị (/var/run/postgresql), và tệp tạm (/tmp).
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: quanly }
            - { name: POSTGRES_DB, value: quanly }
            # FAIL-CLOSED: KHÔNG optional. Thiếu key DATABASE_PASSWORD → pod không khởi động (thay vì chạy
            # với mật khẩu rỗng). secret.example.yaml đã định nghĩa sẵn key này.
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: quanly-secrets, key: DATABASE_PASSWORD } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "quanly"] }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: quanly-pgdata }
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: quanly
spec:
  type: ClusterIP
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
