apiVersion: apps/v1
kind: Deployment
metadata:
  name: quanly-worker
  namespace: quanly
  labels: { app: quanly, component: worker }
spec:
  replicas: 2
  selector:
    matchLabels: { app: quanly, component: worker }
  template:
    metadata:
      labels: { app: quanly, component: worker }
    spec:
      # ÂN HẠN DỪNG. src/worker.ts bắt SIGTERM rồi `await Worker.close()` — bản KHÔNG cưỡng bức,
      # tức nó chờ job đang chạy xong. Không khai khoá này thì k8s cho đúng 30s mặc định rồi
      # SIGKILL, mà riêng bước sinh file của một job xuất đã được cấp trần cứng 30s
      # (`EXPORT_GEN_TIMEOUT_MS` ở src/exportQueue.ts), chưa kể tải lên kho object và ghi CSDL sau đó.
      # Trần đó CÓ HIỆU LỰC với tiến trình worker: `sinhFileXuat` trong src/worker.ts đi qua
      # `runExportJob(..., { choPhepNoiTuyen: false })`, tức sinh file trong worker_threads và hết
      # hạn là `terminate()` giết luồng. (Trước bản vá src/worker.ts KHÔNG hề import exportQueue.js
      # và gọi thẳng buildQuoteBuffer — con số 90 khi đó neo vào một trần không tồn tại.)
      # Job bị cắt ngang không "chạy lại ngay": BullMQ giữ khoá tới hết lockDuration (5 phút,
      # src/queue.ts) rồi mới cho chạy lại — người dùng thấy bản xuất đứng im suốt lượt deploy.
      # 90 = 3× trần 30s, đủ chỗ cho upload + ghi CSDL. Đây là con số CHỌN CÓ CĂN CỨ, KHÔNG phải
      # số đo: sandbox không có cụm k8s nên chưa ai bấm giờ một lượt đóng worker thật.
      # Phải khớp với `worker.terminationGracePeriodSeconds` của chart Helm và `stop_grace_period`
      # của compose — ba đường triển khai cùng một hệ thống, lệch nhau là lỗi lại mọc ở đường kia.
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/ndh0408/quanly-baogia:REPLACE_ME # kustomize `images:` ghi đè — xem kustomization.yaml
          imagePullPolicy: IfNotPresent
          # Khớp app.yaml: hệ thống tệp gốc CHỈ ĐỌC, bỏ sạch capability, cấm leo thang đặc quyền.
          # /tmp gắn riêng vì engine Prisma cần chỗ ghi.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          envFrom:
            - configMapRef: { name: quanly-config }
            - secretRef: { name: quanly-secrets }
          env:
            - { name: WORKER_MODE, value: "true" }
            - { name: WORKER_CONCURRENCY, value: "4" }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 1, memory: 1Gi }
          # Gọi THẲNG node, không qua `npm run`: npm chen thêm một tiến trình trung gian làm PID 1,
          # SIGTERM dừng ở đó và worker không nhận được tín hiệu → job đang chạy bị cắt ngang thay vì
          # đóng êm. Lệnh này khớp Dockerfile CMD (cùng một artifact đã biên dịch).
          command: ["node", "dist/worker.js"]
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quanly-worker
  namespace: quanly
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: quanly-worker
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
