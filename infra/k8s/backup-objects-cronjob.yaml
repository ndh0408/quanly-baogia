# Sao lưu KHO OBJECT cho nhánh triển khai k8s.
#
# VÌ SAO CÓ FILE NÀY: từ 2026-08-11 ảnh chứng từ thanh toán đã RỜI CSDL sang kho object; CSDL chỉ
# còn giữ khoá + SHA-256. backup-cronjob.yaml sao lưu Postgres, nên nhánh k8s TRƯỚC ĐÂY chỉ sao lưu
# được một nửa: mất bucket là mất CHỨNG TỪ TÀI CHÍNH, trong khi mọi hàng trong CSDL vẫn còn và trỏ
# vào hư không. Nhánh docker-compose đã có scripts/backup/backup-objects.sh làm đúng việc này; đây
# là bản tương ứng cho k8s.
#
# CƠ CHẾ: `mc mirror` CỘNG DỒN — cố ý KHÔNG dùng --remove. Nếu bucket bị xoá nhầm (hoặc bị mã hoá
# tống tiền) thì bản sao lưu phải GIỮ LẠI vật, chứ không đồng bộ luôn cái xoá đó. Đó là khác biệt
# giữa "bản sao lưu" và "bản chép".
#
# ══════════════════════════════════════════════════════════════════════════════════════════════
# ⚠️  CHƯA TỪNG CHẠY THẬT TRÊN CLUSTER. ĐỪNG COI NHÁNH K8S LÀ "ĐÃ CÓ SAO LƯU KHO OBJECT".
#
# File này mới chỉ qua `kubeconform` — tức chỉ kiểm được HÌNH DẠNG YAML, không kiểm được ảnh
# `minio/mc` có sẵn những lệnh mà script dùng hay không. Ảnh đó dựng trên UBI-micro, một bản nền
# cắt rất sâu. Bản đầu của file này dùng `find -printf` (phần mở rộng riêng của GNU findutils) và
# `xargs`; với `set -e`, một lệnh không tồn tại là job chết lúc 02:30 — không ai thấy, và đội vận
# hành vẫn tin rằng chứng từ tài chính đã có bản sao lưu. Đã viết lại để chỉ dùng `mc` cho mọi
# thao tác liệt kê/xoá, nhưng `sha256sum`, `sed`, `sort`, `wc`, `tr` thì VẪN CHƯA XÁC MINH ĐƯỢC.
#
# VIỆC PHẢI LÀM TRƯỚC KHI TIN FILE NÀY:
#   1. kind/minikube: `kubectl create job --from=cronjob/quanly-object-backup thu-1` rồi đọc log.
#   2. Xác nhận log kết thúc bằng `OBJECT_BACKUP_DONE` và manifest_*.tsv có nội dung.
#   3. Diễn tập khôi phục TỪ bản gương này, không chỉ nhìn nó tồn tại.
# Nhánh ĐANG CHẠY THẬT là docker-compose + scripts/backup/backup-objects.sh — đó mới là đường được
# kiểm chứng. Xem docs/REMAINING_RISKS.md.
# ══════════════════════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: quanly-object-backups
  namespace: quanly
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 50Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: quanly-object-backup
  namespace: quanly
spec:
  schedule: "30 2 * * *" # 02:30, sau lượt dump CSDL lúc 02:00
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: mc-mirror
              image: minio/mc:RELEASE.2024-11-21T17-21-54Z
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                # `mc` ghi cấu hình vào $HOME/.mc. Pod chạy readOnlyRootFilesystem + runAsUser 1000
                # nên $HOME KHÔNG ghi được → mc lỗi ngay ở lệnh đầu tiên. Trỏ vào emptyDir /tmp đã
                # khai sẵn bên dưới. (Bản compose chạy mc bằng root với lớp ghi container nên không
                # gặp chuyện này — logic được dời vào pod mà chưa kiểm lại môi trường.)
                - name: HOME
                  value: /tmp
                - name: MC_CONFIG_DIR
                  value: /tmp/.mc
                # Cặp khoá đi qua env (không qua argv): argv của tiến trình đọc được từ trong pod.
                - name: S3_ENDPOINT
                  valueFrom: { secretKeyRef: { name: quanly-secrets, key: S3_ENDPOINT } }
                - name: S3_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: quanly-secrets, key: S3_ACCESS_KEY } }
                - name: S3_SECRET_KEY
                  valueFrom: { secretKeyRef: { name: quanly-secrets, key: S3_SECRET_KEY } }
                - name: S3_BUCKET
                  valueFrom: { configMapKeyRef: { name: quanly-config, key: S3_BUCKET } }
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  umask 077
                  export MC_HOST_q="$(echo "$S3_ENDPOINT" | sed "s#://#://$S3_ACCESS_KEY:$S3_SECRET_KEY@#")"
                  echo "Mirroring q/$S3_BUCKET -> /objects (cộng dồn, KHÔNG lan truyền xoá)"
                  mc mirror --quiet --overwrite "q/$S3_BUCKET" /objects
                  # Đối chiếu SỐ LƯỢNG: mirror trả 0 mà thiếu object thì bản sao lưu vô dụng và
                  # không ai biết cho tới lúc cần khôi phục thật.
                  # ĐẾM BẰNG `mc` CHO CẢ HAI PHÍA, KHÔNG DÙNG `find`/`xargs`/`stat`.
                  # Ảnh minio/mc dựng trên UBI-micro: nó KHÔNG có findutils, và `find -printf` là
                  # phần mở rộng riêng của GNU. Với `set -e`, lệnh đầu tiên không tồn tại là job
                  # chết — mà job chết lúc 02:30 thì không ai thấy, và đội vận hành vẫn tin rằng
                  # ảnh chứng từ thanh toán đã có bản sao lưu. Dùng đúng công cụ chắc chắn có
                  # trong ảnh: chính `mc`.
                  #
                  # `| wc -l` chứ không `grep -c .`: với bucket RỖNG, `grep -c .` in "0" NHƯNG
                  # thoát mã 1, nên `|| echo 0` in thêm một "0" nữa và biến thành chuỗi "0\n0".
                  REMOTE_N=$(mc ls --recursive --quiet "q/$S3_BUCKET" | wc -l | tr -d ' ')
                  LOCAL_N=$(mc ls --recursive --quiet /objects | grep -v '/manifest_' | wc -l | tr -d ' ')
                  echo "bucket=$REMOTE_N gương=$LOCAL_N"
                  [ "$REMOTE_N" -eq 0 ] || [ "$LOCAL_N" -ge "$REMOTE_N" ] || { echo "BẢN GƯƠNG THIẾU OBJECT"; exit 1; }
                  # Manifest SHA-256: ghi .partial rồi đổi tên, để một lượt chết giữa chừng không
                  # để lại manifest cụt mà bước kiểm khôi phục sau này lại tin là hợp lệ.
                  # `mc cat` + `sha256sum` thay cho `stat`/`sha256sum` trên đường dẫn: mc luôn có,
                  # còn coreutils thì không chắc. Kích thước lấy từ chính `mc ls --json`.
                  STAMP=$(date +%Y%m%d_%H%M%S)
                  M="/objects/manifest_${STAMP}.tsv"
                  mc ls --recursive --json /objects | \
                    sed -n 's/.*"key":"\([^"]*\)".*"size":\([0-9]*\).*/\1\t\2/p' | \
                    grep -v '^manifest_' | sort > /tmp/keys.tsv
                  : > "$M.partial"
                  while IFS="$(printf '\t')" read -r k sz; do
                    [ -n "$k" ] || continue
                    h=$(mc cat "/objects/$k" | sha256sum | cut -d' ' -f1)
                    printf '%s\t%s\t%s\n' "$k" "$sz" "$h" >> "$M.partial"
                  done < /tmp/keys.tsv
                  mv "$M.partial" "$M"
                  # Giữ 30 manifest gần nhất. `mc rm` thay `xargs -r rm -f` (xargs cũng thuộc
                  # findutils). Vòng lặp `while read` chịu được danh sách rỗng, không cần `-r`.
                  mc ls --quiet /objects | sed -n 's/.*\(manifest_[0-9_]*\.tsv\)$/\1/p' | \
                    sort -r | tail -n +31 | while IFS= read -r old; do
                      [ -n "$old" ] && mc rm --force "/objects/$old" || true
                    done
                  echo "OBJECT_BACKUP_DONE"
              volumeMounts:
                - { name: objects, mountPath: /objects }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: objects
              persistentVolumeClaim:
                claimName: quanly-object-backups
            - { name: tmp, emptyDir: {} }
