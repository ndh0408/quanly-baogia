apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quanly.fullname" . }}-app
  labels: {{- include "quanly.labels" . | nindent 4 }}
spec:
  {{- if not .Values.app.autoscaling.enabled }}
  replicas: {{ .Values.app.replicaCount }}
  {{- end }}
  selector:
    matchLabels: {{- include "quanly.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: {{- include "quanly.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      {{- if .Values.metrics.enabled }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
      {{- end }}
    spec:
      serviceAccountName: {{ include "quanly.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: app
          image: {{ include "quanly.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - { name: http, containerPort: 3000 }
          envFrom:
            - configMapRef: { name: {{ include "quanly.fullname" . }}-config }
            - secretRef:    { name: {{ include "quanly.secretName" . }} }
          resources: {{- toYaml .Values.app.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: /livez, port: http }
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          # Khởi động lần đầu phải chạy `prisma migrate deploy` trước khi nghe cổng. Không có
          # startupProbe thì livenessProbe bắt đầu đếm ngay và giết pod giữa chừng migration trên
          # cụm chậm/migration dài → deploy không bao giờ lên được. (infra/k8s/app.yaml đã có, chart
          # thì thiếu.) 30 × 2s = tối đa 60s cho lần khởi động đầu.
          startupProbe:
            httpGet: { path: /livez, port: http }
            failureThreshold: 30
            periodSeconds: 2
          {{- if .Values.app.runMigration }}
          # Versioned, non-destructive, advisory-locked migrations (safe across replicas).
          # Do NOT use `prisma db push --accept-data-loss` — it can drop columns/data.
          # LỆNH PHẢI KHỚP Dockerfile CMD: `node dist/server.js`. Bản trước ghi `node src/server.js`
          # — file đó KHÔNG tồn tại trong image (mã nguồn là .ts, và nay image chỉ chứa dist/) nên
          # mọi pod chết vòng lặp ngay lần deploy Helm đầu tiên.
          command: ["/bin/sh", "-c"]
          args: ["npx prisma migrate deploy && exec node dist/server.js"]
          {{- end }}
          volumeMounts:
            # Prisma query engine + tsx/node cần chỗ ghi tạm. Có volume này thì
            # securityContext.readOnlyRootFilesystem=true bật được (values.yaml).
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity: {{- toYaml .Values.affinity | nindent 8 }}
      {{- else if .Values.spreadAcrossNodes }}
      # Rải replica ra các node khác nhau. "preferred" chứ không "required": cụm 1 node vẫn lập
      # lịch được, cụm nhiều node thì mất 1 node không hạ hết API.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {{- include "quanly.selectorLabels" . | nindent 20 }}
                    app.kubernetes.io/component: api
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quanly.fullname" . }}-app
  labels: {{- include "quanly.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "quanly.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
{{- if .Values.app.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "quanly.fullname" . }}-app
  labels: {{- include "quanly.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "quanly.fullname" . }}-app
  minReplicas: {{ .Values.app.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.app.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.app.autoscaling.targetCPU }} }
    {{- if .Values.app.autoscaling.targetMemory }}
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: {{ .Values.app.autoscaling.targetMemory }} }
    {{- end }}
{{- end }}
