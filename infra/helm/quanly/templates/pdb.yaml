{{- if .Values.podDisruptionBudget.enabled }}
# Giữ tối thiểu N pod app sống khi node bị rút có kế hoạch (drain / node upgrade).
# Không có PDB thì `kubectl drain` hạ được cả hai replica cùng lúc → API đứt hẳn trong lúc bảo trì.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "quanly.fullname" . }}-app
  labels: {{- include "quanly.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "quanly.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
{{- if .Values.worker.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "quanly.fullname" . }}-worker
  labels: {{- include "quanly.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "quanly.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
{{- end }}
{{- end }}
