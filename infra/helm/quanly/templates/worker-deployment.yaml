{{- if .Values.worker.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quanly.fullname" . }}-worker
  labels: {{- include "quanly.labels" . | nindent 4 }}
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  selector:
    matchLabels: {{- include "quanly.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels: {{- include "quanly.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "quanly.serviceAccountName" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Worker không phục vụ HTTP nên không có probe HTTP. Cho nó đủ thời gian đóng job đang chạy
      # khi rolling update — worker.ts bắt SIGTERM và gọi Worker.close() để job hiện tại chạy nốt.
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds | default 60 }}
      containers:
        - name: worker
          image: {{ include "quanly.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          envFrom:
            - configMapRef: { name: {{ include "quanly.fullname" . }}-config }
            - secretRef:    { name: {{ include "quanly.secretName" . }} }
          env:
            - { name: WORKER_MODE, value: "true" }
            - { name: WORKER_CONCURRENCY, value: "{{ .Values.worker.concurrency }}" }
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          # Khớp artifact đã biên dịch trong image (xem Dockerfile). Bản trước gọi `src/worker.js`
          # — không tồn tại → worker chết vòng lặp và MỌI job nền (xuất Excel/PDF, email, webhook,
          # dọn dữ liệu) im lặng không chạy.
          command: ["node", "dist/worker.js"]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
{{- if .Values.worker.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "quanly.fullname" . }}-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "quanly.fullname" . }}-worker
  minReplicas: {{ .Values.worker.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.worker.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.worker.autoscaling.targetCPU }} }
{{- end }}
{{- end }}
