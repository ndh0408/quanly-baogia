{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "quanly.serviceAccountName" . }}
  labels: {{- include "quanly.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "quanly.fullname" . }}
  labels: {{- include "quanly.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "quanly.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      # /metrics trả 404 ở production khi request không kèm METRICS_TOKEN (src/app.ts). Không có
      # khối này thì Prometheus scrape đều đặn, nhận 404 đều đặn, và bảng số liệu trống trơn mà
      # KHÔNG có cảnh báo nào — im lặng đúng lúc cần nhìn nhất.
      authorization:
        type: Bearer
        credentials:
          name: {{ include "quanly.secretName" . }}
          key: METRICS_TOKEN
{{- end }}
