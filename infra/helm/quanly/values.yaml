# Default values for quanly-baogia chart.

image:
  repository: ghcr.io/ndh0408/quanly-baogia
  # Ưu tiên digest — bất biến tuyệt đối, rollback luôn quay đúng bản mã cũ.
  #   digest: "sha256:..."
  digest: ""
  # Nếu không dùng digest thì đặt tag TƯỜNG MINH (git sha). Bỏ trống → lấy Chart.appVersion.
  # "latest" bị chặn (xem helper quanly.image) vì hai pod cùng ReplicaSet có thể chạy hai bản mã
  # khác nhau và không có gì để rollback về.
  tag: ""
  allowMutableTag: false
  pullPolicy: IfNotPresent
  pullSecrets: []

# === Replicas / autoscaling ===
app:
  replicaCount: 2
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 1, memory: 1Gi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPU: 70
    targetMemory: 80
  # Run prisma db push before app starts. Disable when running migrations as a separate Job.
  runMigration: true

worker:
  enabled: true
  replicaCount: 2
  concurrency: 4
  # Thời gian cho worker chạy nốt job đang xử lý khi bị dừng (SIGTERM → Worker.close()).
  terminationGracePeriodSeconds: 60
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 1, memory: 1Gi }
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 6
    targetCPU: 70

# === Networking ===
service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  host: baogia.example.com
  tls:
    enabled: true
    secretName: quanly-tls
    clusterIssuer: letsencrypt-prod
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"

# === Embedded dependencies (turn off when using managed services) ===
postgres:
  enabled: true # set false to use external DB
  image: postgres:16-alpine
  # Mật khẩu Postgres NỘI BỘ. Bản trước ghi CHẾT chuỗi `CHANGE_ME_INTERNAL` trong hai template và
  # KHÔNG có key nào ở values để đổi — nghĩa là mọi cài đặt chart dùng Postgres nhúng đều chạy với
  # đúng một mật khẩu mà bất kỳ ai đọc repo cũng biết. NetworkPolicy có chặn pod lạ, nhưng đó là
  # phòng thủ theo mạng, không phải lý do để dùng thông tin đăng nhập ai cũng biết.
  # KHÔNG có mặc định dùng được: một placeholder hợp lệ nghĩa là chart cài được và CHẠY được với
  # mật khẩu mà bất kỳ ai đọc repo cũng biết — không ai bị buộc phải đổi. Bỏ trống thì helper
  # `quanly.postgresPassword` gọi `required` và chart TỪ CHỐI render, giống hệt cách image.tag=latest
  # đang bị chặn. Sinh: openssl rand -base64 24
  password: ""
  storageSize: 20Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 1, memory: 1Gi }

redis:
  enabled: true # set false to use external Redis
  image: redis:7-alpine
  # Mật khẩu Redis nội bộ (dùng cho --requirepass + nhúng vào REDIS_URL). Bỏ trống có chủ đích —
  # xem chú thích ở postgres.password. Sinh: openssl rand -base64 24
  password: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

# NetworkPolicy: chặn mọi pod khác (không thuộc release này) kết nối Postgres/Redis. Cần CNI hỗ trợ.
networkPolicy:
  enabled: true

# === Application config (non-secret) ===
config:
  NODE_ENV: production
  PORT: "3000"
  LOG_LEVEL: info
  BCRYPT_COST: "12"
  PASSWORD_MIN_LENGTH: "8"
  LOGIN_MAX_ATTEMPTS: "5"
  LOGIN_LOCKOUT_MINUTES: "15"
  RATE_LIMIT_LOGIN_PER_15M: "10"
  RATE_LIMIT_API_PER_MIN: "120"
  DEFAULT_PAGE_SIZE: "20"
  MAX_PAGE_SIZE: "100"
  JWT_ACCESS_TTL: "15m"
  JWT_REFRESH_TTL_DAYS: "7"
  S3_REGION: "auto"
  S3_BUCKET: "quanly"
  S3_FORCE_PATH_STYLE: "true"
  TRUST_PROXY: "1"

# === Secrets ===
# Either fill these (chart creates the Secret) OR set existingSecret to use yours.
existingSecret: "" # name of an externally managed Secret with the same keys

secrets:
  DATABASE_URL: "" # required if postgres.enabled=false
  REDIS_URL: "" # required if redis.enabled=false
  SESSION_SECRET: "" # REQUIRED, ≥32 chars
  JWT_SECRET: "" # optional; defaults to SESSION_SECRET
  # BẮT BUỘC ở production: src/config.ts process.exit(1) nếu thiếu → deploy theo file mẫu chết ngay
  # lúc khởi động, không phải lúc ai đó bật MFA.
  MFA_ENC_KEY: ""
  # ⚠️ MẤT KHOÁ NÀY = MẤT DỮ LIỆU. Ba trường PII (CCCD / số tài khoản / lương) được mã hoá bằng nó;
  # thiếu khoá thì bản ghi mới ghi THÔ (chỉ console.warn) còn bản ghi cũ ném lỗi lúc giải mã.
  # Sao lưu khoá ở nơi KHÁC với bản dump CSDL.
  PII_ENC_KEY: ""
  # /metrics trả 404 ở production khi thiếu token (src/app.ts). ServiceMonitor gửi kèm token này.
  METRICS_TOKEN: ""
  S3_ENDPOINT: ""
  S3_ACCESS_KEY: ""
  S3_SECRET_KEY: ""
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_USER: ""
  SMTP_PASS: ""
  SMTP_FROM: ""
  TELEGRAM_BOT_TOKEN: ""
  SENTRY_DSN: ""
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""

serviceAccount:
  create: true
  annotations: {}

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  # Bật được rồi: template app/worker đã gắn emptyDir vào /tmp cho engine Prisma ghi tạm.
  readOnlyRootFilesystem: true

podSecurityContext:
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# PodDisruptionBudget: khi node được rút (drain/upgrade) k8s vẫn phải giữ tối thiểu ngần này pod
# app sống. Không có PDB thì một lệnh `kubectl drain` có thể hạ sạch replica cùng lúc = downtime.
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # Worker dùng maxUnavailable chứ KHÔNG dùng chung minAvailable với app. Lý do: worker autoscale
  # xuống minReplicas=1, và `minAvailable: 1` trên một Deployment có đúng 1 pod làm eviction API
  # từ chối vĩnh viễn → `kubectl drain` treo, node không bao giờ rút được. Với maxUnavailable thì
  # drain luôn kết thúc, còn job đang chạy vẫn đóng êm nhờ terminationGracePeriodSeconds: 60.
  workerMaxUnavailable: 1

nodeSelector: {}
tolerations: []
# Rải pod app ra các node khác nhau khi có thể (soft anti-affinity — không chặn lập lịch nếu cụm
# chỉ có 1 node). Hai replica nằm chung một node thì mất node là mất cả hai.
spreadAcrossNodes: true
affinity: {}

# Metrics scraping
metrics:
  enabled: true
  serviceMonitor:
    enabled: false # set true if you have prometheus-operator
    interval: 30s
