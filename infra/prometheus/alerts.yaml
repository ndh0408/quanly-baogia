# ============================================================================
# Quy tắc cảnh báo Prometheus cho QuanLY.
#
# Kiểm cú pháp + PromQL:  npm run check:alerts   (scripts/ci/check-alerts.sh, dùng promtool)
#
# ── VÌ SAO CÓ FILE NÀY ─────────────────────────────────────────────────────
# src/observability.ts phát 13 metric riêng cộng bộ mặc định của prom-client. Trước file này,
# KHÔNG có một quy tắc cảnh báo nào trong repo (`find infra -iname '*alert*'` không ra gì). Nghĩa
# là số liệu chỉ dùng được khi đã có người MỞ dashboard ra xem — mà lúc hệ thống hỏng thì không ai
# đang xem. Có metric mà không có cảnh báo là có hộp đen kèm đèn báo không ai nối dây.
#
# ── MỖI QUY TẮC BÁM VÀO MỘT SỰ CỐ CÓ THẬT ──────────────────────────────────
# Không có quy tắc nào ở đây là "cho đủ bộ". Từng cái tương ứng một chế độ hỏng đã được ghi lại
# trong mã nguồn hoặc trong docs/REMAINING_RISKS.md, và `annotations.runbook` chỉ tới chỗ đó.
#
# ── ĐIỀU KIỆN ĐỂ CHÚNG CHẠY ĐƯỢC ───────────────────────────────────────────
# ⚠️ Production hiện chạy docker-compose và CHƯA có Prometheus nào scrape (xem
#    docs/REMAINING_RISKS.md). File này là thứ ĐÃ SẴN SÀNG để nạp, chưa phải thứ đang chạy.
#    Đừng đọc nó thành "hệ thống đã có cảnh báo".
# ⚠️ `/metrics` ở production TRẢ 404 khi thiếu METRICS_TOKEN (src/app.ts), và 401 khi Bearer sai.
#    Không đặt token thì Prometheus scrape ra 404 và MỌI quy tắc dưới đây im lặng vĩnh viễn —
#    `QuanlyMetricsKhongScrapeDuoc` sinh ra để bắt đúng chuyện đó.
#
# ── CÁCH NẠP ───────────────────────────────────────────────────────────────
# Prometheus thường:      thêm đường dẫn file này vào `rule_files:` trong prometheus.yml
# prometheus-operator:    bọc `groups:` bên dưới vào một CR `PrometheusRule`:
#     apiVersion: monitoring.coreos.com/v1
#     kind: PrometheusRule
#     metadata: { name: quanly, labels: { release: <tên-release-prometheus> } }
#     spec:
#       <dán nguyên khối `groups:` bên dưới vào đây>
#   (Chart Helm KHÔNG tự sinh CR này: `.Files.Get` của Helm chỉ đọc được file NẰM TRONG chart, mà
#    giữ hai bản của cùng một tập quy tắc là cách chắc chắn để chúng trôi khỏi nhau. Một file, dán
#    tay một lần, hơn hai file tự động lệch nhau.)
# ============================================================================
groups:
  # ── Nhóm 1: ứng dụng còn sống và còn đo được ─────────────────────────────
  - name: quanly.suc-khoe
    rules:
      - alert: QuanlyMetricsKhongScrapeDuoc
        # `up` do chính Prometheus sinh cho mỗi target. 0 = scrape hỏng: tiến trình chết, mạng
        # đứt, HOẶC /metrics trả 404/401 vì METRICS_TOKEN sai — trường hợp cuối là cấu hình sai
        # âm thầm làm TẤT CẢ quy tắc còn lại vô hiệu, nên nó phải là cảnh báo đầu tiên của file.
        expr: up{job=~"quanly.*"} == 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "Không scrape được {{ $labels.instance }}"
          description: >-
            Prometheus không lấy được /metrics trong 3 phút. Nếu tiến trình vẫn sống thì gần như
            chắc chắn là METRICS_TOKEN: src/app.ts trả 404 khi production thiếu token và 401 khi
            Bearer sai. Mọi cảnh báo khác trong nhóm này đang MÙ cho tới khi cái này hết.
          runbook: "src/app.ts — handler /metrics"

      - alert: QuanlyKhongConTargetNao
        # `up == 0` chỉ kêu khi CÒN target để kêu. Xoá nhầm ServiceMonitor / đổi nhãn job thì
        # target biến mất hẳn và `up` không sinh chuỗi nào — im lặng tuyệt đối. `absent()` bắt ca đó.
        expr: absent(up{job=~"quanly.*"})
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "Không còn target QuanLY nào trong Prometheus"
          description: >-
            Không có chuỗi `up{job=~"quanly.*"}` nào tồn tại. Khác hẳn "scrape hỏng": ở đây
            Prometheus không biết là CÓ thứ cần scrape. Thường do ServiceMonitor bị xoá, nhãn
            release không khớp, hoặc đổi tên job.
          runbook: "infra/helm/quanly/templates/sa.yaml — ServiceMonitor"

      - alert: QuanlyTiLeLoi5xxCao
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total[5m])), 0.001) > 0.02
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "Trên 2% request trả 5xx (10 phút liên tục)"
          description: >-
            `clamp_min` ở mẫu số là có chủ ý: ban đêm lưu lượng có thể về 0 và phép chia 0/0 cho ra
            NaN — quy tắc sẽ KHÔNG kêu đúng lúc mọi request đều hỏng nhưng chỉ có vài request.

      - alert: QuanlyDoTreP95Cao
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 2
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "P95 độ trễ HTTP vượt 2 giây"
          description: >-
            Bucket cao nhất của histogram này là 10 giây (src/observability.ts). P95 vượt 2s thường
            là cạn pool CSDL (DB_POOL_MAX) hoặc một truy vấn quét bảng.
          runbook: "src/db.ts — chú thích về DB_POOL_MAX"

  # ── Nhóm 2: realtime (SSE) ───────────────────────────────────────────────
  - name: quanly.sse
    rules:
      - alert: QuanlySseBackplaneChet
        # Biểu thức này lấy NGUYÊN VĂN từ khối chú thích của `sseBackplaneMode` trong
        # src/observability.ts. Hai vế là bắt buộc: chỉ kiểm `sse_backplane_up == 0` sẽ kêu oan ở
        # bản triển khai MỘT tiến trình cố ý không dùng Redis, và một cảnh báo hay kêu oan thì bị tắt.
        expr: sse_backplane_mode{mode="redis"} == 1 and on(instance) sse_backplane_up == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Backplane Redis của SSE chết trên {{ $labels.instance }}"
          description: >-
            Instance này được cấu hình chạy chế độ redis nhưng backplane đang không lên. Nhiều
            replica + backplane chết = người dùng nối vào instance A không thấy thay đổi do người
            trên instance B tạo. Không màn hình nào báo lỗi; danh sách chỉ đơn giản là không cập nhật.
          runbook: "src/sse.ts — biến `pub` và hàm `backplaneDangDung`"

      - alert: QuanlySsePublishThatBai
        expr: sum(rate(sse_backplane_errors_total[10m])) > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "PUBLISH sự kiện SSE qua Redis đang thất bại"
          description: >-
            Redis pub/sub KHÔNG có bộ đệm: một sự kiện phát lúc không publish được là MẤT HẲN, không
            có cách phát lại. Mỗi lần tăng là một lần màn hình của ai đó không cập nhật.

  # ── Nhóm 3: xuất file (Excel/PDF) ────────────────────────────────────────
  - name: quanly.xuat-file
    rules:
      - alert: QuanlyHangDoiXuatDay
        # `export_max_queue_depth` là gauge do chính app phát ra từ EXPORT_MAX_PENDING — so với
        # gauge thay vì với hằng số viết cứng, để đổi cấu hình không làm quy tắc sai.
        expr: export_queue_depth >= export_max_queue_depth
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Hàng đợi chờ xuất file đã đầy trên {{ $labels.instance }}"
          description: >-
            Hàng đợi chờ có TRẦN (EXPORT_MAX_PENDING). Đầy nghĩa là yêu cầu xuất mới bị TỪ CHỐI
            ngay, không phải xếp hàng — người dùng nhận lỗi chứ không phải chờ lâu.
          runbook: "src/exportQueue.ts"

      - alert: QuanlyXuatFileBiTuChoi
        expr: sum by (reason) (rate(export_rejected_total[15m])) > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Yêu cầu xuất file đang bị từ chối (lý do: {{ $labels.reason }})"
          description: "Mỗi lần tăng là một người dùng bấm Xuất và không nhận được file."

      - alert: QuanlyWorkerXuatCangCung
        expr: export_active_workers >= export_max_active_workers
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Mọi worker xuất file bận liên tục 15 phút"
          description: >-
            Chưa phải sự cố, nhưng là ngưỡng trước khi `QuanlyHangDoiXuatDay` nổ. Cân nhắc tăng
            EXPORT_MAX_ACTIVE hoặc thêm replica worker.

  # ── Nhóm 4: hàng đợi nền (BullMQ) ────────────────────────────────────────
  - name: quanly.hang-doi
    rules:
      - alert: QuanlyJobNenChatDong
        expr: sum by (queue) (bullmq_jobs{state="waiting"}) > 100
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Hàng đợi {{ $labels.queue }} còn {{ $value }} job đang chờ"
          description: >-
            Trước khi có gauge này, worker chết thì job chất đống trong Redis mà /metrics im lặng
            hoàn toàn — dấu hiệu đầu tiên là người dùng gọi điện.
          runbook: "src/queue.ts — bullQueueDepth"

      - alert: QuanlyJobNenThatBai
        expr: sum by (queue) (bullmq_jobs{state="failed"}) > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Hàng đợi {{ $labels.queue }} có {{ $value }} job THẤT BẠI"
          description: >-
            Job thất bại nằm lại trong Redis chứ không tự biến mất. Đây là gauge ĐẾM TỒN, không
            phải tốc độ — số không tự về 0 cho tới khi ai đó dọn hoặc thử lại.

      - alert: QuanlyKhongCoWorkerNao
        # Cả `waiting` lẫn `active` đều tồn tại nhưng KHÔNG job nào chuyển sang active: dấu hiệu
        # kinh điển của "app còn sống, worker chết". `QuanlyJobNenChatDong` cần 15 phút và ngưỡng
        # 100 job; cái này bắt sớm hơn ở mọi mức tải.
        expr: |
          sum(bullmq_jobs{state="waiting"}) > 0
            and sum(bullmq_jobs{state="active"}) == 0
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "Có job chờ nhưng KHÔNG job nào đang chạy — worker có thể đã chết"
          description: >-
            Deployment worker chạy `node dist/worker.js` TÁCH RIÊNG khỏi app. App vẫn phục vụ
            request bình thường khi worker chết, nên không cảnh báo nào khác bắt được.
          runbook: "infra/helm/quanly/templates/worker-deployment.yaml"

  # ── Nhóm 5: tiến trình Node ──────────────────────────────────────────────
  - name: quanly.tien-trinh
    rules:
      - alert: QuanlyTienTrinhKhoiDongLaiLienTuc
        # `process_start_time_seconds` do collectDefaultMetrics của prom-client phát. Tuổi tiến
        # trình liên tục dưới 10 phút = vòng lặp khởi động lại (crash loop).
        expr: time() - process_start_time_seconds{job=~"quanly.*"} < 600
        for: 20m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} khởi động lại liên tục"
          description: >-
            Tuổi tiến trình liên tục dưới 10 phút trong suốt 20 phút. Nguyên nhân đã gặp: lệnh khởi
            động trỏ vào file không tồn tại, hoặc src/config.ts `process.exit(1)` vì thiếu biến bắt
            buộc ở production (SESSION_SECRET/JWT_SECRET/APP_BASE_URL/MFA_ENC_KEY).
          runbook: "src/config.ts — các chốt chỉ bật ở production"

      - alert: QuanlyEventLoopNgheN
        expr: nodejs_eventloop_lag_p99_seconds{job=~"quanly.*"} > 0.5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Event loop trễ P99 trên 0,5 giây"
          description: >-
            Node chạy MỘT luồng: event loop nghẽn thì MỌI request chậm, kể cả /readyz. Nguyên nhân
            đã gặp trong repo này là công việc nặng chạy nội tuyến thay vì đẩy sang worker thread.
          runbook: "src/exportQueue.ts, src/importWorker.ts"
