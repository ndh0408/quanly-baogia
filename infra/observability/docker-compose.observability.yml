# ============================================================================
# NGĂN XẾP QUAN SÁT — TUỲ CHỌN, KHÔNG BẬT MẶC ĐỊNH.
#
#   docker compose -f docker-compose.prod.yml -f infra/observability/docker-compose.observability.yml up -d
#
# ── VÌ SAO TÁCH RIÊNG THAY VÌ NHÉT VÀO COMPOSE CHÍNH ───────────────────────
# `docs/architecture/TECHNOLOGY_DECISIONS.md` xếp "gom log tập trung" là DEFER: production hiện là
# MỘT VM, `docker logs` còn đủ, và BỐN container nữa (Prometheus + Loki + Promtail + Grafana) ăn RAM
# của chính ứng dụng. Nhưng "chưa cần" khác "chưa dựng được" — file này để lúc cần thì là một lệnh,
# không phải một dự án. Bật nó là quyết định vận hành, không phải mặc định.
#
# ── ĐỌC LOG TỪ ĐÂU ─────────────────────────────────────────────────────────
# Ứng dụng in JSON ra stdout (pino). Docker ghi stdout vào /var/lib/docker/containers/*/*-json.log.
# Promtail đọc thẳng những file đó — KHÔNG cần ứng dụng biết gì về Loki, không cần đổi một dòng mã,
# và ứng dụng không phụ thuộc vào việc hệ log có sống hay không (đúng thứ tự ưu tiên: log hỏng
# không được kéo ứng dụng theo).
#
# ── ĐỌC METRIC TỪ ĐÂU ──────────────────────────────────────────────────────
# Prometheus scrape /metrics của app (`app:3000`) và của worker (`worker:9091`) qua mạng `internal`.
# Cả hai endpoint đó CÓ BẢO VỆ: production mà thiếu METRICS_TOKEN thì trả 404, có token thì đòi
# `Authorization: Bearer` đúng (src/app.ts, src/worker.ts). Token đi vào Prometheus bằng đường TỆP
# (`secrets:` ở cuối file) vì Prometheus không nội suy biến môi trường trong cấu hình.
#
# ── CHỖ PHẢI ĐỔI TRƯỚC KHI DÙNG THẬT ───────────────────────────────────────
#   · METRICS_TOKEN: BẮT BUỘC, đặt trong `.env` của máy chủ. Thiếu nó thì `compose up` dừng ngay
#     (`${METRICS_TOKEN:?…}`) — cố ý, vì một Prometheus scrape ra 404 là một hệ giám sát MÙ mà
#     không có gì báo lỗi.
#   · GF_SECURITY_ADMIN_PASSWORD: đặt trong `.env` của máy chủ, đừng để nguyên ở đây.
#   · Grafana ở đây KHÔNG mở ra Internet (chỉ cổng nội bộ + mạng `internal`). Muốn xem từ xa thì
#     đi qua Cloudflare Tunnel như ứng dụng chính (xem docs/operations/REVERSE_PROXY.md), ĐỪNG
#     publish cổng 3001 ra 0.0.0.0.
#   · Prometheus KHÔNG publish cổng nào ra máy chủ: giao diện 9090 không có xác thực.
services:
  loki:
    image: grafana/loki:3.3.2
    container_name: quanly-loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready | grep -q ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  promtail:
    image: grafana/promtail:3.3.2
    container_name: quanly-promtail
    command: -config.file=/etc/promtail/conf/promtail.yaml
    volumes:
      # ⚠️ MOUNT THƯ MỤC, KHÔNG MOUNT TỆP LẺ. ĐÃ ĐO trên chính VM production:
      #     mount tệp lẻ  → container thấy bản CŨ sau khi deploy thay tệp
      #     mount thư mục → container thấy bản MỚI
      # `deploy.sh` ship bằng `git archive | tar x`, tức nó THAY tệp (inode mới) chứ không sửa tại
      # chỗ. Bind-mount một TỆP gắn vào inode, nên tệp mới không bao giờ tới được container: nó giữ
      # cấu hình cũ cho tới khi có người dựng lại container. Chuyện này ĐÃ XẢY RA THẬT — Prometheus
      # trên production vẫn đọc khối `alerting:` đang bị chú thích dù tệp trên đĩa đã bỏ chú thích,
      # và `/-/reload` cũng không cứu được vì nó đọc lại đúng cái inode cũ.
      # Hệ quả rộng hơn: MỌI thay đổi quy tắc cảnh báo từ trước tới nay cũng chưa từng tới nơi.
      - ./infra/observability:/etc/promtail/conf:ro
      # CHỈ ĐỌC. Promtail không có việc gì phải ghi vào thư mục log của Docker.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/tmp/promtail
    depends_on:
      loki: { condition: service_healthy }
    networks: [internal]
    restart: unless-stopped

  # ── PROMETHEUS ────────────────────────────────────────────────────────────
  # Trước service này, repo đã có metric ứng dụng, quy tắc cảnh báo đã qua `promtool test rules` và
  # một bảng Grafana — mà KHÔNG có một định nghĩa Prometheus nào ở bất kỳ đâu. Tức không môi trường
  # nào thu thập được số liệu, không cảnh báo nào KÊU ĐƯỢC, và datasource của Grafana trỏ vào hư
  # không. Số HIỆN TẠI: 21 metric (`grep -oE 'name: "[a-z_]+"' src/observability.ts | wc -l`) và 17
  # quy tắc (`grep -c '^      - alert:' infra/prometheus/alerts.yaml`) — trước đợt 2026-08-27 là 14
  # và 14. Đo lại bằng hai lệnh đó, đừng tin con số chép tay ở đây.
  #
  # ⚠️ ĐIỀU KIỆN BẮT BUỘC: `.env` của máy chủ PHẢI có METRICS_TOKEN, và app/worker phải nhận CÙNG
  # token đó (chúng đọc từ cùng `.env` qua `env_file` trong docker-compose.prod.yml). Không có
  # token thì /metrics ở production trả 404 cho mọi lượt scrape — im lặng, không lỗi ở đâu cả.
  # Chính vì thế `${METRICS_TOKEN:?...}` dừng `compose up` ngay thay vì dựng một hệ giám sát mù.
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: quanly-prometheus
    command:
      - --config.file=/etc/prometheus/conf/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 15 ngày: đủ cho điều tra sự cố và cho việc "chạy hai tuần rồi đặt lại SLO theo phân vị thật"
      # mà docs/operations/SLO.md đang chờ. Muốn giữ lâu hơn thì cân RAM/đĩa của VM trước.
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle # POST /-/reload để nạp lại quy tắc, không phải restart cả container
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:?đặt METRICS_TOKEN trong .env — thiếu nó thì /metrics trả 404 và MỌI cảnh báo im lặng}
    secrets:
      # Prometheus KHÔNG nội suy biến môi trường trong file cấu hình, nên token phải đi bằng ĐƯỜNG
      # TỆP. Nguồn `environment:` của compose secrets bày giá trị ra /run/secrets/<tên> mà không cần
      # tạo file trên đĩa máy chủ (cần Docker Compose ≥ 2.24; bản cũ hơn thì đổi sang
      # `file: ./secrets/metrics-token` và tự tạo tệp đó, nhớ chmod 600 + thêm vào .gitignore).
      - metrics_token
    volumes:
      # ⚠️ MOUNT THƯ MỤC, KHÔNG MOUNT TỆP LẺ. ĐÃ ĐO trên chính VM production:
      #     mount tệp lẻ  → container thấy bản CŨ sau khi deploy thay tệp
      #     mount thư mục → container thấy bản MỚI
      # `deploy.sh` ship bằng `git archive | tar x`, tức nó THAY tệp (inode mới) chứ không sửa tại
      # chỗ. Bind-mount một TỆP gắn vào inode, nên tệp mới không bao giờ tới được container: nó giữ
      # cấu hình cũ cho tới khi có người dựng lại container. Chuyện này ĐÃ XẢY RA THẬT — Prometheus
      # trên production vẫn đọc khối `alerting:` đang bị chú thích dù tệp trên đĩa đã bỏ chú thích,
      # và `/-/reload` cũng không cứu được vì nó đọc lại đúng cái inode cũ.
      # Hệ quả rộng hơn: MỌI thay đổi quy tắc cảnh báo từ trước tới nay cũng chưa từng tới nơi.
      - ./infra/observability:/etc/prometheus/conf:ro
      # MOUNT THẲNG thư mục chứa bản gốc alerts.yaml — KHÔNG chép nội dung sang chỗ khác.
      # `npm run check:alerts` chỉ kiểm bản gốc đó, nên một bản chép sẽ trôi khỏi nó mà không cổng
      # CI nào đỏ. `rule_files:` trong prometheus.yml trỏ đích danh alerts.yaml, nên alerts.test.yaml
      # nằm cùng thư mục KHÔNG bị nạp làm quy tắc.
      - ./infra/prometheus:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    # CHỈ mạng `internal`. Prometheus giữ toàn bộ số liệu vận hành và giao diện của nó KHÔNG có xác
    # thực — không publish cổng 9090 ra máy chủ, không nối vào mạng `edge`. Muốn xem thì đi qua
    # Grafana (đã có mật khẩu) hoặc `docker compose exec`.
    depends_on:
      # `service_started`, KHÔNG phải `service_healthy`: Prometheus vẫn thu thập số liệu và vẫn
      # đánh giá quy tắc dù Alertmanager có chết — nó chỉ không gửi được ra ngoài. Buộc
      # `service_healthy` là biến một trục trặc của KÊNH THÔNG BÁO thành mất luôn cả phần ĐO.
      alertmanager: { condition: service_started }
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy | grep -q Healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── ALERTMANAGER ──────────────────────────────────────────────────────────
  # MẢNH CUỐI của phần giám sát. Không có nó, 22 quy tắc cảnh báo vẫn được đánh giá và vẫn chuyển
  # sang `firing` — nhưng DỪNG LẠI ở giao diện Prometheus. Có người mở mới thấy. Đó là "có cảnh
  # báo" theo nghĩa kỹ thuật, không phải theo nghĩa vận hành.
  #
  # ⚠️ CẤU HÌNH PHẢI ĐƯỢC DỰNG TRƯỚC KHI CHẠY. Alertmanager KHÔNG nội suy biến môi trường trong
  # cấu hình (ĐÃ ĐO trên v0.28.1 — `/api/v2/status` trả về nguyên chuỗi `${SMTP_HOST}`, mà
  # `amtool check-config` vẫn in "SUCCESS"). Nên `entrypoint` dưới đây thay giá trị vào bản mẫu
  # rồi mới `exec`, và nó TỪ CHỐI KHỞI ĐỘNG nếu thiếu biến hoặc còn sót `${`.
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: quanly-alertmanager
    entrypoint: ["/bin/sh", "/etc/alertmanager/conf/alertmanager-entrypoint.sh"]
    command:
      - --storage.path=/alertmanager
      # Liên kết trong thư trỏ về đây. Prometheus/Alertmanager KHÔNG mở ra Internet, nên đây là
      # địa chỉ để `docker compose exec` hoặc đường hầm dùng — không phải để bấm từ điện thoại.
      - --web.external-url=http://127.0.0.1:9093
    environment:
      # DÙNG LẠI đúng SMTP mà ứng dụng đang gửi thư thật (cùng `.env`), thay vì dựng kênh mới chưa
      # ai thử. Thiếu biến bắt buộc → entrypoint thoát 78, container KHÔNG lên.
      SMTP_HOST: ${SMTP_HOST:?đặt SMTP_HOST trong .env — Alertmanager gửi thư qua chính SMTP của ứng dụng}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:?đặt SMTP_FROM trong .env}
      # KHÔNG bắt buộc, và đó là CỐ Ý: dev dùng MailHog (`SMTP_HOST=mailhog`, cổng 1025), vốn
      # không xác thực và SMTP_USER rỗng. Rỗng → entrypoint gỡ hẳn hai dòng `smtp_auth_*` và tắt
      # `smtp_require_tls`. Có giá trị → bắt buộc cả mật khẩu lẫn TLS.
      SMTP_USER: ${SMTP_USER:-}
      # Ở production, bỏ trống thì gửi về CHÍNH hòm thư đang dùng để gửi — không đoán địa chỉ
      # người nhận, vì một cảnh báo gửi nhầm chỗ im lặng y như không gửi. Ở dev SMTP_USER rỗng nên
      # PHẢI đặt ALERT_EMAIL_TO trong .env (bất kỳ địa chỉ nào, MailHog nhận hết).
      # Nhiều người nhận: ngăn cách bằng dấu phẩy.
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-${SMTP_USER:-}}
    secrets:
      # Mật khẩu KHÔNG đi qua phép thay chuỗi và KHÔNG nằm trong file cấu hình đã dựng:
      # `smtp_auth_password_file` trỏ thẳng vào đây.
      - smtp_password
    volumes:
      # ⚠️ MOUNT THƯ MỤC, KHÔNG MOUNT TỆP LẺ. ĐÃ ĐO trên chính VM production:
      #     mount tệp lẻ  → container thấy bản CŨ sau khi deploy thay tệp
      #     mount thư mục → container thấy bản MỚI
      # `deploy.sh` ship bằng `git archive | tar x`, tức nó THAY tệp (inode mới) chứ không sửa tại
      # chỗ. Bind-mount một TỆP gắn vào inode, nên tệp mới không bao giờ tới được container: nó giữ
      # cấu hình cũ cho tới khi có người dựng lại container. Chuyện này ĐÃ XẢY RA THẬT — Prometheus
      # trên production vẫn đọc khối `alerting:` đang bị chú thích dù tệp trên đĩa đã bỏ chú thích,
      # và `/-/reload` cũng không cứu được vì nó đọc lại đúng cái inode cũ.
      # Hệ quả rộng hơn: MỌI thay đổi quy tắc cảnh báo từ trước tới nay cũng chưa từng tới nơi.
      - ./infra/observability:/etc/alertmanager/conf:ro
      # Silence + nhật ký đã-gửi. MẤT volume này = mọi cảnh báo đang im bỗng kêu lại sau khi khởi
      # động lại, và mọi `silence` người vận hành đặt trong lúc bảo trì biến mất.
      - alertmanager-data:/alertmanager
    tmpfs:
      # Chỗ ghi bản cấu hình ĐÃ DỰNG. Là tmpfs chứ không phải volume: nó sinh ra từ `.env`, không
      # có lý do gì để sống sót qua một lần khởi động lại — dựng lại mỗi lần là cách bảo đảm nó
      # luôn khớp `.env` hiện tại. (ĐÃ ĐO: thiếu dòng này thì container thoát ngay với
      # `mkdir: can't create directory '/render': Permission denied` — ảnh chạy bằng `nobody`.)
      - /render
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9093/-/healthy >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  grafana:
    image: grafana/grafana:11.4.0
    container_name: quanly-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?đặt GRAFANA_PASSWORD trong .env}
      # Không cho tự đăng ký, không cho xem ẩn danh — đây là màn hình có số liệu vận hành thật.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # CHỈ nghe trên loopback của VM. Ra ngoài thì qua đường hầm, không qua cổng mở.
      - "127.0.0.1:3001:3000"
    depends_on:
      loki: { condition: service_healthy }
      # `service_started`, KHÔNG phải `service_healthy`. Grafana không cần Prometheus khoẻ để khởi
      # động — datasource chỉ được truy vấn khi có người mở bảng. Buộc `service_healthy` là biến một
      # trục trặc của healthcheck Prometheus thành "không mở được Grafana", tức mất luôn cả phần
      # LOG đang chạy tốt. Healthcheck của prometheus vẫn giữ, nhưng để người vận hành nhìn, không
      # để chặn.
      prometheus: { condition: service_started }
    networks: [internal]
    restart: unless-stopped

volumes:
  loki-data:
  alertmanager-data:
  promtail-positions:
  grafana-data:
  prometheus-data:

secrets:
  metrics_token:
    # Nguồn `environment` (Docker Compose ≥ 2.24): giá trị của biến METRICS_TOKEN được bày ra
    # /run/secrets/metrics_token trong container, KHÔNG nằm lại trên đĩa máy chủ và KHÔNG lộ trong
    # `docker inspect` như một biến môi trường thường. Bản compose cũ hơn: đổi thành
    # `file: ./secrets/metrics-token`.
    environment: METRICS_TOKEN
  smtp_password:
    # Mật khẩu ứng dụng Gmail của chính hòm thư ứng dụng đang dùng. Vào bằng đường TỆP
    # (/run/secrets/smtp_password) chứ không qua `environment:` — nên nó không lộ trong
    # `docker inspect` và không bị phép thay chuỗi của entrypoint chạm tới.
    environment: SMTP_PASS

networks:
  internal:
    external: false
