# Nguồn dữ liệu nạp sẵn — không phải bấm tay sau mỗi lần dựng lại Grafana.
apiVersion: 1
datasources:
  - name: Loki
    type: loki
    access: proxy
    uid: loki
    url: http://loki:3100
    isDefault: false
    jsonData:
      maxLines: 2000
  - name: Prometheus
    type: prometheus
    access: proxy
    uid: prometheus
    # Prometheus KHÔNG nằm trong ngăn xếp này (repo đã có metric + alerts.yaml sẵn; nơi chạy
    # Prometheus là quyết định riêng). Đổi URL này cho khớp chỗ đang chạy.
    url: ${PROMETHEUS_URL:-http://prometheus:9090}
    isDefault: true
