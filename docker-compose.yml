# XOAY VÒNG LOG cho MỌI service. Driver mặc định của Docker là json-file KHÔNG giới hạn: app dùng
# pino-http ghi mỗi request một dòng, VM chỉ có MỘT đĩa, và khi đĩa đầy thì Postgres không ghi nổi
# WAL nữa — mất dữ liệu vì log, không phải vì lỗi mã. 10MB × 5 tệp = trần 50MB mỗi container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    container_name: quanly-postgres
    logging: *default-logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quanly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quanly_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-quanly}
    # CHỈ loopback (áp cho MỌI kho dữ liệu bên dưới). Không có tiền tố 127.0.0.1 thì docker mở cổng
    # ra MỌI giao diện — kể cả Wi-Fi/LAN/Tailscale — và luật DOCKER-USER của nó đi vòng qua tường lửa
    # của máy. Kho dữ liệu dev mang mật khẩu mặc định ghi thẳng trong chính file này, nên "mở ra LAN"
    # nghĩa là ai cùng mạng cũng đọc/ghi được Postgres, Redis, MinIO và hòm thư dev.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - quanly-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quanly} -d ${POSTGRES_DB:-quanly}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: quanly-redis
    logging: *default-logging
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"] # khớp prod: allkeys-lru xoá mất khoá job BullMQ + khoá phiên
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - quanly-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: quanly-minio
    logging: *default-logging
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - quanly-miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: quanly-mailhog
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # Web UI

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quanly-app
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-quanly}:${POSTGRES_PASSWORD:-quanly_pwd}@postgres:5432/${POSTGRES_DB:-quanly}?schema=public
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-quanly}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: "Báo Giá Gia Nguyễn <noreply@gianguyen.local>"
      TRUST_PROXY: "1"
    ports:
      - "3000:3000"
    profiles: ["full"]

volumes:
  quanly-pgdata:
  quanly-redisdata:
  quanly-miniodata:
